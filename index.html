<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Zengo - Zero Distractions. Just Go.</title>
    <meta name="description" content="Zero Distractions. Just Go. A minimalist Go board for one or two players." />
    <meta name="author" content="izzardry" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Zengo" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Zengo - Zero Distractions. Just Go." />
    <meta property="og:description" content="A minimalist Go game. 9×9 to 19×19, 12 computer levels, serverless rooms for two, and zero ads." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://izzardry.github.io/zengo/" />
    <meta property="og:image" content="https://izzardry.github.io/zengo/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zengo - Zero Distractions. Just Go." />
    <meta name="twitter:description" content="A minimalist Go game. 9×9 to 19×19, 12 computer levels, serverless rooms for two, and zero ads." />
    <meta name="twitter:image" content="https://izzardry.github.io/zengo/og-image.png" />

    <!--
      First paint (src/boot.ts): the theme and the background are set before anything loads, so a
      reload never flashes the other theme. #root stays transparent until the brand font is in and
      the first layout has settled; then it fades in over 300 ms (Ztyle's chrome duration). If the
      app's script never runs, the page shows itself after 10 s. The reveal has its own keyframes:
      reusing the fallback's would update that animation in place instead of fading.
    -->
    <script>
      try {
        if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      html { background: #fafafa; }
      html.dark { background: #0d0d0d; }
      @keyframes zengo-boot-fallback { from { opacity: 0; } to { opacity: 1; } }
      @keyframes zengo-reveal { from { opacity: 0; } to { opacity: 1; } }
      #root { opacity: 0; animation: zengo-boot-fallback 0.3s ease-out 10s forwards; }
      html.zengo-ready #root { opacity: 1; animation: zengo-reveal 0.3s ease-out; }
      html.zengo-ready.zengo-late #root { animation: none; }
      @media (prefers-reduced-motion: reduce) {
        html.zengo-ready #root { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
