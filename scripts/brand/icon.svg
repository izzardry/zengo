<?xml version="1.0" encoding="UTF-8"?>
<!--
  Zengo app icon: master artwork (DESIGN 2, Ztyle 01 "App icon").

  #0d0d0d full-bleed tile, the corner of a Go board as a faint thin-stroke 3 × 3 grid (the two
  board edges a little heavier, the other lines running on), and one black and one white stone
  from the stone set touching diagonally in the centre. The stones are drawn as on the board in
  the dark theme (src/components/board/stones.tsx): Black filled with ink-dark, White with
  ink-light, both with a thin foreground outline at 75 % and a very soft radial shading
  (highlight top left on Black, shade bottom right on White). Grayscale only, no shadow.

  `scripts/generate-brand-images.mjs` rasterizes this file into public/. It relies on the ids:
    #tile    full-bleed background (kept at 100 % in the maskable variant)
    #motif   everything else (scaled into the safe zone for the maskable variant)
    #grid    the grid hint (hidden at favicon sizes, where it would turn to mush)
    #stones  the two stones (enlarged at favicon sizes)

  Geometry: grid lines at 96, 202.67, 309.33 and 416 (pitch 106.67). The stones sit on the two
  intersections of the centre cell's falling diagonal, so they touch at (256, 256):
  outer radius = pitch × √2 / 2 = 75.42, outline 6, circle radius 72.42.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- The stone set's shading (src/components/board/stones.tsx), in the dark theme's inks -->
    <radialGradient id="stone-black-shade" cx="0.35" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#f2f2f2" stop-opacity="0.06" />
      <stop offset="1" stop-color="#f2f2f2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="stone-white-shade" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0.45" stop-color="#0d0d0d" stop-opacity="0" />
      <stop offset="1" stop-color="#0d0d0d" stop-opacity="0.08" />
    </radialGradient>
  </defs>
  <rect id="tile" width="512" height="512" fill="#0d0d0d" />
  <g id="motif">
    <g id="grid" fill="none" stroke="#f2f2f2" stroke-linecap="square" opacity="0.18">
      <!-- The board's two edges (top, left) -->
      <path stroke-width="3" d="M96 96H448 M96 96V448" />
      <!-- Inner lines, running on past the cell to suggest the rest of the board -->
      <path stroke-width="2" d="M202.67 96V448 M309.33 96V448 M416 96V448 M96 202.67H448 M96 309.33H448 M96 416H448" />
    </g>
    <g id="stones" stroke="#f2f2f2" stroke-opacity="0.75" stroke-width="6">
      <g transform="translate(202.67 202.67)">
        <circle r="72.42" fill="#0d0d0d" />
        <circle r="72.42" fill="url(#stone-black-shade)" stroke="none" />
      </g>
      <g transform="translate(309.33 309.33)">
        <circle r="72.42" fill="#f2f2f2" />
        <circle r="72.42" fill="url(#stone-white-shade)" stroke="none" />
      </g>
    </g>
  </g>
</svg>
